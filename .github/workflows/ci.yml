name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkm-notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: pkm-notes/go.sum
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Test
        run: go test -race -tags sqlite_fts5 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkm-notes/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test
