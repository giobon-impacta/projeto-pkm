<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d12">
    <title>PKM Notes</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/src/main.js"></script>
</head>
<body class="panel-open">
    <aside class="activity-rail" aria-label="Navegação principal">
        <button class="brand-mark" id="homeButton" type="button" aria-label="Voltar à pesquisa" title="Voltar à pesquisa">P</button>
        <button class="rail-button is-active" type="button" data-panel="files" aria-label="Abrir pastas" title="Pastas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 8.5v-2a2 2 0 0 1 2-2h3l2 2"/></svg>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-button" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
    </aside>

    <aside class="workspace-panel" id="workspacePanel" data-panel="files" aria-label="Pastas e notas">
        <header class="panel-header">
            <h2 id="panelTitle">Pastas e notas</h2>
            <button class="icon-button" id="closePanel" type="button" aria-label="Recolher painel">×</button>
        </header>
        <div id="panelContent" class="panel-content"></div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <span class="brand-dot" aria-hidden="true"></span>
                <h1>PKM Notes</h1>
                <span class="breadcrumb" id="currentFolder">Todas as notas</span>
            </div>
            <div class="topbar-actions">
                <button class="button button-primary" id="newNote" type="button"><span aria-hidden="true">＋</span> Nova nota</button>
            </div>
        </header>

        <div id="searchView">
            <section class="search-area" aria-label="Pesquisa de notas">
                <div class="search-box">
                    <span class="search-symbol" aria-hidden="true">⌕</span>
                    <input id="searchInput" type="search" autocomplete="off" placeholder="Pesquisar notas..." aria-label="Pesquisar notas">
                    <span class="search-shortcut" aria-hidden="true">/</span>
                </div>
                <div class="search-toolbar">
                    <div class="search-modes" role="group" aria-label="Modo de pesquisa">
                        <button class="mode-button is-active" type="button" data-mode="title" aria-pressed="true">Títulos</button>
                        <button class="mode-button" type="button" data-mode="content" aria-pressed="false">Conteúdo</button>
                    </div>
                    <div class="result-count" id="resultCount" aria-live="polite"></div>
                </div>
            </section>

            <section class="results-section" aria-label="Resultados">
                <div class="results-heading">
                    <h2 id="resultsTitle">Todas as notas</h2>
                    <button class="text-button" id="clearFolder" type="button" hidden>Limpar pasta</button>
                </div>
                <div id="notesList" class="notes-list" aria-live="polite"></div>
                <nav class="pagination" id="pagination" aria-label="Paginação" hidden>
                    <button class="button button-muted" id="previousPage" type="button">Anterior</button>
                    <span id="pageStatus"></span>
                    <button class="button button-muted" id="nextPage" type="button">Próxima</button>
                </nav>
            </section>
        </div>

        <section id="editorView" class="editor-view" aria-label="Editor de nota" hidden>
            <header class="editor-header">
                <label class="sr-only" for="noteTitle">Título da nota</label>
                <input id="noteTitle" class="title-field" name="title" maxlength="256" placeholder="Título da nota" autocomplete="off">
                <div class="editor-header-actions">
                    <span id="saveStatus" class="save-status" aria-live="polite"></span>
                    <button class="icon-button danger-hover" id="deleteCurrentNote" type="button" aria-label="Excluir nota" title="Excluir nota" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
                </div>
            </header>
            <div class="editor-toolbar">
                <div class="markdown-tools" role="toolbar" aria-label="Formatação Markdown">
                    <button type="button" data-action="undo" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled>↶</button>
                    <button type="button" data-action="redo" aria-label="Refazer" title="Refazer (Ctrl+Y)" disabled>↷</button>
                    <span class="toolbar-divider"></span>
                    <button type="button" data-format="bold" aria-label="Negrito" title="Negrito (Ctrl+B)"><strong>B</strong></button>
                    <button type="button" data-format="italic" aria-label="Itálico" title="Itálico (Ctrl+I)"><em>I</em></button>
                    <button type="button" data-format="strike" aria-label="Tachado" title="Tachado">S</button>
                    <span class="toolbar-divider"></span>
                    <button type="button" data-format="heading" aria-label="Título" title="Título">H</button>
                    <button type="button" data-format="link" aria-label="Link" title="Link">↗</button>
                    <button type="button" data-format="code" aria-label="Código" title="Código">&lt;/&gt;</button>
                    <button type="button" data-format="quote" aria-label="Citação" title="Citação">❞</button>
                    <span class="toolbar-divider"></span>
                    <button type="button" data-format="unordered" aria-label="Lista" title="Lista">•≡</button>
                    <button type="button" data-format="ordered" aria-label="Lista numerada" title="Lista numerada">1≡</button>
                    <button type="button" data-format="task" aria-label="Tarefa" title="Tarefa">☐</button>
                    <button type="button" data-format="codeblock" aria-label="Bloco de código" title="Bloco de código">{ }</button>
                </div>
                <div class="editor-toolbar-right">
                    <button class="text-button save-now" id="saveNow" type="button">Salvar agora</button>
                    <div class="editor-modes" role="group" aria-label="Modo do editor">
                        <button type="button" class="editor-mode" data-editor-mode="edit" aria-pressed="false">Edição</button>
                        <button type="button" class="editor-mode is-active" data-editor-mode="split" aria-pressed="true">Dividido</button>
                        <button type="button" class="editor-mode" data-editor-mode="preview" aria-pressed="false">Leitura</button>
                    </div>
                </div>
            </div>
            <div class="editor-workspace" data-editor-mode="split">
                <section class="editor-pane edit-pane" aria-label="Edição Markdown">
                    <span class="pane-label">Markdown</span>
                    <div class="source-editor">
                        <pre class="source-highlight" id="sourceHighlight" aria-hidden="true"></pre>
                        <textarea id="noteContent" name="content" spellcheck="false" aria-label="Conteúdo Markdown" placeholder="# Comece a escrever..."></textarea>
                    </div>
                </section>
                <div class="editor-splitter" role="separator" aria-label="Redimensionar editor e pré-visualização" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>
                <section class="editor-pane preview-pane" aria-label="Pré-visualização">
                    <span class="pane-label">Pré-visualização</span>
                    <article id="markdownPreview" class="markdown-preview"></article>
                </section>
            </div>
        </section>
        <div id="appMessage" class="app-message" role="status" aria-live="polite"></div>
    </main>
</body>
</html>
